[package]
name = "eterras-gift"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# The app beside the launcher (crates/launcher, eterras-gift.exe), as the C# EterrasGift.Desktop.exe is beside
# EterrasGift.exe; eg_core::paths::EXECUTABLE names it.
[[bin]]
name = "eterras-gift-desktop"
path = "src/main.rs"

[dependencies]
eg-core.workspace = true
eg-companion.workspace = true
eg-ui.workspace = true
eg-trainer = { path = "../trainer" }
eg-trainer-host = { path = "../trainer-host" }
tokio.workspace = true
slint.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
syn = { version = "2", features = ["full", "visit"] }

[lints]
workspace = true
