[package]
name = "eterras-gift"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

# The app is an install's only entry, with no launcher before it; eg_core::paths::EXECUTABLE names it.
[[bin]]
name = "eterras-gift"
path = "src/main.rs"

[dependencies]
file-ops.workspace = true
eg-core.workspace = true
eg-companion.workspace = true
spiderland-slint.workspace = true
task-runtime.workspace = true
eg-ui.workspace = true
eg-trainer.workspace = true
eg-trainer-screens.workspace = true
# The trainer helper DLL, embedded in the exe and built for its explicit target. A path, not `workspace = true`:
# inheriting drops `artifact` and `target`. Only the DLL is taken, never the helper's library, so the IL2CPP and hook
# code it links stays out of the app; no other app crate depends on them. The pinned `target` keeps the DLL's features
# its own under `cargo build`. Under `cargo test --workspace` it is built with the helper's test features, so the app's
# tests embed a test build of it, not what ships.
eg-trainer-helper = { path = "../trainer-helper", artifact = "cdylib", target = "x86_64-pc-windows-msvc" }
tokio.workspace = true
slint.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
