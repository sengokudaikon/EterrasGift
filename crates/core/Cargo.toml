[package]
name = "eg-core"
description = "The shared kernel: where the app keeps its files, its settings, fault reports, and what Player.log says. It never names a module."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
eg-i18n.workspace = true
eg-runtime.workspace = true
jiff.workspace = true
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
