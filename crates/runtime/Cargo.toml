[package]
name = "eg-runtime"
description = "The desktop's background work on Tokio: one owned reactor thread and blocking pool, with a close barrier and a record of panics. It names neither this app nor the game."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Features the helper must not get stay here rather than on the workspace's tokio (tests/architecture.rs holds it to that).
tokio = { workspace = true, features = ["macros", "process"] }
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
