[package]
name = "eg-companion"
description = "The companion tier: finds, watches and starts Last Epoch from its files and Steam's. It never opens or reads the game process."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
eg-core.workspace = true
eg-flow.workspace = true
eg-i18n.workspace = true
eg-runtime.workspace = true
jiff.workspace = true
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros"] }
dotscope = "=0.9.1"
toml_edit = "=0.25.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
