[package]
name = "eg-game-access"
description = "The trainer's game boundary: explicit IL2CPP ABI and thread-owned runtime access."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
il2cpp = ["dep:eg-il2cpp-runtime", "dep:detour", "dep:iced-x86"]

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }

[dependencies]
detour = { version = "=0.10.0", optional = true }
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder", "instr_info"], optional = true }
eg-il2cpp-runtime = { workspace = true, optional = true }
eg-trainer-wire = { path = "../trainer-wire" }
eg-core.workspace = true
tokio.workspace = true

[dev-dependencies]
eg-il2cpp-runtime = { workspace = true, features = ["test-stubs"] }

[lints]
workspace = true
