# The app. It builds on two workspaces of their own, which name neither the app nor the game: the libraries (`libs/`) and
# the UI framework (`../spiderland`, a repository of its own).
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["libs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Slint is pinned exactly: point releases have broken APIs before (crates/ui/README.md).
slint = "=1.18.1"
slint-build = "=1.18.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
windows-sys = "0.61.2"
jiff = "0.2.38"
regex = "1.13.1"
uuid = { version = "1.28.0", features = ["v4"] }
# File and folder pickers, parented to the Slint window through raw-window-handle 0.6.
rfd = { version = "0.17.2", default-features = false }
raw-window-handle = "0.6.2"
tempfile = "3.27.0"
tokio = { version = "=1.53.3", features = ["rt", "net", "io-util", "time", "sync"] }

task-runtime = { path = "libs/task-runtime" }
binary-reader = { path = "libs/binary-reader" }
spiderland = { path = "../spiderland/spiderland", features = ["nightly"] }
spiderland-slint = { path = "../spiderland/spiderland-slint" }
il2cpp-runtime = { path = "libs/il2cpp-runtime" }
native-hooks = { path = "libs/native-hooks" }
eg-core = { path = "crates/core" }
spiderland-phrases = { path = "../spiderland/spiderland-phrases" }
spiderland-phrases-build = { path = "../spiderland/spiderland-phrases-build" }
file-ops = { path = "libs/file-ops" }
melon-loader = { path = "libs/melon-loader" }
unity-files = { path = "libs/unity-files" }
win-platform = { path = "libs/win-platform" }
eg-companion = { path = "crates/companion" }
eg-ui = { path = "crates/ui" }
eg-trainer = { path = "crates/trainer" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.dev]
# Backtraces keep their files and lines; only a debugger's variables are lost. Nearly halves a checkout's build outputs
# (20 GB to 11 GB for what `verify` builds) and links faster. `CARGO_PROFILE_DEV_DEBUG=2` brings them back for one build.
debug = "line-tables-only"

# Code that runs inside the game is built as for a release in every profile: no debug assertion or overflow check may
# fire in the game. That holds for the helper's own dependencies too (tokio and its I/O, windows-sys, the detour hooks and their decoder),
# since a dev `mise run run` embeds this build and injects it.
[profile.dev.package.eg-trainer-helper]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.eg-game-access]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.il2cpp-runtime]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.native-hooks]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.win-platform]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.eg-trainer-wire]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.tokio]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.mio]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.socket2]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.bytes]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.windows-sys]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.detour]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.iced-x86]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.region]
opt-level = 3
debug-assertions = false
overflow-checks = false

# The captures encode every PNG and fill every pixel on the software renderer: unoptimised, those dominate their run.
[profile.dev.package.png]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.i-slint-renderer-software]
opt-level = 2

# What `mise run run` draws with: Slint's property and layout engine, FemtoVG and the glyph and vector rasterisers.
# Unoptimised, a dev window lags behind what ships (Eterra's band takes 21 ms a frame against 1 ms). Third-party only,
# so it costs one build.
[profile.dev.package.i-slint-core]
opt-level = 2

[profile.dev.package.i-slint-renderer-femtovg]
opt-level = 2

[profile.dev.package.femtovg]
opt-level = 2

[profile.dev.package.resvg]
opt-level = 2

[profile.dev.package.tiny-skia]
opt-level = 2

[profile.dev.package.tiny-skia-path]
opt-level = 2

[profile.dev.package.zeno]
opt-level = 2

[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package.read-fonts]
opt-level = 2

# Every connect hashes the game files it checks, about 150 MB: unoptimised that is seconds (2.4 s for 130 MB, measured),
# optimised 55 ms, as in a release build.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
