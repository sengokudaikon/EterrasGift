[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Slint is pinned exactly: point releases have broken APIs before (research/slint.md).
slint = "=1.18.1"
slint-build = "=1.18.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
kurbo = "0.13.1"
windows-sys = "0.61.2"
jiff = "0.2.38"
regex = "1.13.1"
sha2 = "0.11.1"
uuid = { version = "1.28.0", features = ["v4"] }
# File and folder pickers, parented to the Slint window through raw-window-handle 0.6.
rfd = { version = "0.17.2", default-features = false }
tempfile = "3.27.0"
tokio = { version = "=1.53.3", features = ["rt", "net", "io-util", "time", "sync"] }

eg-core = { path = "crates/core" }
eg-companion = { path = "crates/companion" }
eg-ui = { path = "crates/ui" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
