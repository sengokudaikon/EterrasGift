[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Slint is pinned exactly: point releases have broken APIs before (research/slint.md).
slint = "=1.18.1"
slint-build = "=1.18.1"
# The parser slint-build bundles translations with, so the Rust phrases' table takes what the views take.
rspolib = "=0.1.2"
# The user's locale, read as Slint reads it to pick a bundled translation.
sys-locale = "0.3.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
windows-sys = "0.61.2"
jiff = "0.2.38"
regex = "1.13.1"
sha2 = "0.11.1"
uuid = { version = "1.28.0", features = ["v4"] }
# File and folder pickers, parented to the Slint window through raw-window-handle 0.6.
rfd = { version = "0.17.2", default-features = false }
raw-window-handle = "0.6.2"
tempfile = "3.27.0"
tokio = { version = "=1.53.3", features = ["rt", "net", "io-util", "time", "sync"] }
# LZ4 blocks in Unity bundles; pure Rust, no unsafe in the decoder.
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-decode", "safe-encode", "checked-decode"] }

eg-binary = { path = "crates/binary" }
eg-il2cpp-metadata = { path = "crates/il2cpp-metadata" }
eg-il2cpp-runtime = { path = "crates/il2cpp-runtime" }
eg-core = { path = "crates/core" }
eg-i18n = { path = "crates/i18n" }
eg-companion = { path = "crates/companion" }
eg-ui = { path = "crates/ui" }
eg-trainer = { path = "crates/trainer" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"

# Code that runs inside the game is built as for a release in every profile: the helper's build-ID getter is checked
# in its optimised form (`lea rax,[rip+…]; ret`), and no debug assertion or overflow check may fire in the game. That
# holds for the helper's own dependencies too (tokio and its I/O, windows-sys, the detour hooks and their decoder),
# since a dev `mise run run` embeds this build and injects it.
[profile.dev.package.eg-trainer-helper]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.eg-game-access]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.eg-il2cpp-runtime]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.eg-trainer-wire]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.tokio]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.mio]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.socket2]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.bytes]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.windows-sys]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.detour]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.iced-x86]
opt-level = 3
debug-assertions = false
overflow-checks = false

[profile.dev.package.region]
opt-level = 3
debug-assertions = false
overflow-checks = false

# The captures encode every PNG and fill every pixel on the software renderer: unoptimised, those dominate their run.
[profile.dev.package.png]
opt-level = 2

[profile.dev.package.fdeflate]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

[profile.dev.package.i-slint-renderer-software]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
