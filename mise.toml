# Project tasks: `mise tasks` lists them, `mise run <task>` runs one. Prefer these over ad-hoc scripts (AGENTS.md).
# Rust nightly is selected by rust-toolchain.toml; slint-viewer and slint-lsp 1.18.1 are on PATH.

[tasks.build]
description = "Build the workspace"
run = "cargo build"

[tasks.run]
description = "Run the app: real settings, real game host"
run = "cargo run -p eterras-gift"

[tasks.lint]
description = "Clippy over every target, warnings as errors"
run = "cargo lint"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Fail if anything is unformatted"
run = "cargo fmt --all --check"

[tasks.tokens]
description = "Regenerate tokens.slint and the icons from design/tokens.json"
run = "cargo xtask tokens"

[tasks."tokens:check"]
description = "Fail if tokens.slint or the icons are stale"
run = "cargo xtask tokens --check"

[tasks.capture]
description = "Headless PNG captures of the real UI on the fake game host, into artifacts/captures"
run = "cargo capture"

[tasks.test]
description = "Every workspace test in the dev profile, on fakes; no live game. The captures run under capture"
# eg-ui's only integration target is the captures (harness = false), run by `capture`; `test = false` would hide them
# from `cargo lint` too.
run = ["cargo test --workspace --exclude eg-ui --offline", "cargo test -p eg-ui --lib --offline"]

[tasks."ui:test"]
description = "UI presentation and asynchronous editor tests on fake services (part of test)"
run = "cargo test -p eg-ui --lib --offline"

[tasks."capture:trainer"]
description = "Worker-to-UI reads, ordered drafts, typed write outcomes and Undo on owned fake sessions"
run = "cargo capture -- --trainer-backend"

[tasks.verify]
description = "Everything to run before calling work done: lint, format, tokens, tests, both capture runs; then look at artifacts/captures"
run = ["cargo lint", "cargo fmt --all --check", "cargo xtask tokens --check", "mise run test", "cargo capture", "cargo capture -- --trainer-backend"]

[tasks."slint:check"]
description = "Fast compile check of a .slint file (default: app.slint)"
run = "slint-viewer --check {{arg(name='file', default='crates/ui/ui/app.slint')}}"

[tasks.preview]
description = "Live preview of a .slint file, reloading on save (default: app.slint)"
run = "slint-viewer --auto-reload {{arg(name='file', default='crates/ui/ui/app.slint')}}"

[tasks.live]
description = "The app with Slint's MCP server on 127.0.0.1:9316, headless. Real game host: never click Play"
run = "cargo run -p eterras-gift --features slint/mcp --target-dir target/mcp"
# Debug info is read at build time, the rest at run time. target/mcp keeps the normal build's cache intact.
env = { SLINT_EMIT_DEBUG_INFO = "1", SLINT_MCP_PORT = "9316", SLINT_BACKEND = "headless" }

[tasks."live:window"]
description = "As live, in a visible window"
run = "cargo run -p eterras-gift --features slint/mcp --target-dir target/mcp"
env = { SLINT_EMIT_DEBUG_INFO = "1", SLINT_MCP_PORT = "9316" }

[tasks."live:viewer"]
description = "slint-viewer with its MCP server on 127.0.0.1:9315 (opens a window; no Rust logic)"
run = "slint-viewer {{arg(name='file', default='crates/ui/ui/app.slint')}}"
env = { SLINT_MCP_PORT = "9315" }

[tasks."game-files:install"]
description = "Read the game data from a real install named by EG_LAST_EPOCH (the game folder), and check the rebuilt layouts against every shipped type tree; files only, no game process"
run = "cargo test -p eg-game-files --release -- --ignored --nocapture"

[tasks."trainer:test"]
description = "The trainer packages' tests alone (part of test); no live game"
run = "cargo test -p eg-trainer-wire -p eg-game-access -p eg-trainer -p eg-trainer-helper --offline"

[tasks."trainer:verify"]
description = "verify, then the isolated controller's tests; required for trainer changes"
run = ["mise run verify", "mise run trainer:player:client:test"]

[tasks."trainer:helper:build"]
description = "Build and snapshot the Rust helper with source/DLL identities, for the fixture player; no process access. The desktop embeds its own"
run = "pwsh -NoProfile -File tools/trainer-eval/persistent-player/Build-Helper.ps1"

[tasks."trainer:player:client:build"]
description = "Build the isolated authored Unity-player controller; no player launch"
run = "cargo build --manifest-path tools/trainer-eval/persistent-player/client/Cargo.toml --release --offline"

[tasks."trainer:player:client:test"]
description = "Controller/response-barrier tests; no player launch. Release, as its build and the lifecycle run are (its own workspace has no dev overrides for in-game code)"
run = "cargo test --manifest-path tools/trainer-eval/persistent-player/client/Cargo.toml --release --offline"

[tasks."trainer:unload"]
description = "Plain native fixture: 100 unload/reloads with active callers, then a stuck callback; no Unity or game"
run = ["cargo build -p eg-trainer-helper --release --features fixture --offline", "cargo test -p eg-trainer-helper --release --features fixture --test unload --offline -- --ignored --nocapture"]

[tasks."trainer:player:lifecycle"]
description = "Build and exercise owned Unity 6000.4.8f1 menu departure, zone travel and fresh external helper loads; no game"
run = "pwsh -NoProfile -File tools/trainer-eval/persistent-player/Run-Lifecycle.ps1"
