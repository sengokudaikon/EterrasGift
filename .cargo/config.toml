[alias]
# cargo xtask tokens [--check]: regenerate crates/ui/ui/tokens.slint, the icons and the radial gradients from design/tokens.json
xtask = "run --quiet -p xtask --"
# Warnings are errors: a warning left in passes unnoticed in every later build.
lint = "clippy --workspace --all-targets -- -D warnings"
# Headless PNG captures of the real UI into artifacts/captures.
capture = "test -p eg-ui --test captures"

[unstable]
# Artifact dependencies: the desktop embeds the trainer helper DLL (crates/app). Nightly-only, as the pinned toolchain is.
bindeps = true
